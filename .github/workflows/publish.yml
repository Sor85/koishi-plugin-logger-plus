name: Publish

on:
  push:
    tags:
      - 'koishi-plugin-logger-plus@*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: 启用 Corepack
        run: corepack enable

      - name: 安装依赖
        run: yarn install --immutable

      - name: 运行测试
        run: yarn test

      - name: 发布到 npm
        run: npm publish --access public
